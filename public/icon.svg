<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFBEB" />
      <stop offset="50%" stopColor="#FEF3C7" />
      <stop offset="100%" stopColor="#FDE68A" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FDE047" />
      <stop offset="100%" stopColor="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#D97706" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Smiling Cheerful Bear / Star Character -->
  <g filter="url(#shadow)">
    <!-- Cheerful Puppy/Bear face -->
    <!-- Ears -->
    <circle cx="160" cy="180" r="50" fill="#FBBF24" />
    <circle cx="160" cy="180" r="28" fill="#F472B6" />
    <circle cx="352" cy="180" r="50" fill="#FBBF24" />
    <circle cx="352" cy="180" r="28" fill="#F472B6" />

    <!-- Head -->
    <circle cx="256" cy="270" r="140" fill="#FDE047" />

    <!-- Snout -->
    <ellipse cx="256" cy="300" rx="60" ry="46" fill="#FEF9C3" />
    <!-- Nose -->
    <ellipse cx="256" cy="280" rx="20" ry="14" fill="#78350F" />
    <!-- Mouth -->
    <path d="M 240 300 Q 256 316 272 300" fill="none" stroke="#78350F" stroke-width="8" stroke-linecap="round" />

    <!-- Eyes (Happy Arcs) -->
    <path d="M 195 240 Q 215 220 235 240" fill="none" stroke="#78350F" stroke-width="10" stroke-linecap="round" />
    <path d="M 277 240 Q 297 220 317 240" fill="none" stroke="#78350F" stroke-width="10" stroke-linecap="round" />

    <!-- Rosy Cheeks -->
    <circle cx="175" cy="285" r="22" fill="#F43F5E" opacity="0.45" />
    <circle cx="337" cy="285" r="22" fill="#F43F5E" opacity="0.45" />

    <!-- Sparkle Stars -->
    <path d="M 120 110 Q 120 130 100 130 Q 120 130 120 150 Q 120 130 140 130 Q 120 130 120 110" fill="#F59E0B" />
    <path d="M 390 120 Q 390 140 370 140 Q 390 140 390 160 Q 390 140 410 140 Q 390 140 390 120" fill="#F59E0B" />
  </g>
</svg>
